# InsiderLens web — nginx for the Vite static build (Phase 08).
# /api/* proxies to the api service; everything else = SPA history fallback.
# Pitfall P3: proxy_pass WITHOUT trailing slash keeps /api/... path exact.
server {
    listen 80;
    server_name _;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # static assets — immutable fingerprinted bundles from vite
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API reverse proxy (no trailing slash on proxy_pass → path preserved 1:1)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # /api/cases/{id}/export streams can take a moment
    }
    location = /health { proxy_pass http://api:8000/health; }

    # SPA fallback — BrowserRouter paths must reach index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # security headers (mirror of the API middleware — belt & suspenders)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
