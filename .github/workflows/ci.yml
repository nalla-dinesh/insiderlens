# InsiderLens CI — every command here is first proven green locally (Phase 08 §2).
# Branch protection: require ALL four checks on PRs (see docs/CONVENTIONS.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insider
          POSTGRES_PASSWORD: insider
          POSTGRES_DB: insiderlens_test        # CI service creds MUST match P1
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insider -d insiderlens_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://insider:insider@localhost:5432/insiderlens_test
      INSIDERLENS_TEST_DATABASE_URL: postgresql+asyncpg://insider:insider@localhost:5432/insiderlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (dev extras)
        run: |
          python -m pip install -U pip
          pip install -e "apps/api[dev]"
      - name: Lint (ruff)
        run: pip install ruff && ruff check apps/api scripts
      - name: Schema (alembic)
        run: cd apps/api && alembic upgrade head
      - name: Ingest mini fixture (~500 txns — the CI bundle)
        run: |
          cd apps/api && python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          from app.db.session import build_engine, build_session_factory
          from app.services.ingestion import IngestionService
          async def main():
              eng = build_engine(os.environ["DATABASE_URL"])
              rep = await IngestionService(
                  build_session_factory(eng), Path("tests/fixtures/mini_bundle")
              ).run()
              print(f"CI mini-bundle: {rep.total_inserted} rows, checksum={rep.checksum_ok}")
              await eng.dispose()
          asyncio.run(main())
          PY
      - name: Unit + API tests
        run: cd apps/api && pytest -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install (lockfile-pinned)
        run: cd apps/web && npm ci
      - name: Lint
        run: cd apps/web && npm run lint
      - name: Build
        run: cd apps/web && npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (proves image compiles; no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: insiderlens-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image (proves image compiles; no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: insiderlens-web:ci

  e2e:
    needs: [api-test, web-build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insider
          POSTGRES_PASSWORD: insider
          POSTGRES_DB: insiderlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insider -d insiderlens"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://insider:insider@localhost:5432/insiderlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Start stack (compose, demo profile = seed + analyze)
        run: docker compose -f infra/docker-compose.yml --profile demo up --build -d
      - name: Wait for health + seeder
        run: |
          for i in $(seq 1 90); do
            status=$(curl -sf http://localhost:8000/health | grep -c ok || true)
            total=$(curl -sf "http://localhost:8000/api/alerts?limit=1" | python3 -c "import json,sys;print(json.load(sys.stdin)['total'])" 2>/dev/null || echo 0)
            echo "tick $i health=$status alerts=$total"
            [ "$total" -gt 0 ] && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
      - name: Phase-06 E2E happy path
        run: BASE=http://localhost:8000 bash scripts/e2e_happy_path.sh
      - name: Upload E2E log
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
        if: always()
