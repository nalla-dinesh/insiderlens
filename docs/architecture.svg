<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Inter,system-ui,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#0f6a8a"/>
    </marker>
    <style>
      .box{fill:#0b2540;rx:10}
      .txt{fill:#e8eef5;font-size:14px;font-weight:600}
      .sub{fill:#9db4c8;font-size:11px}
      .cap{fill:#0f6a8a;font-size:11px;font-weight:700}
      .ext{fill:#f4f7fa;stroke:#b8c6d4;stroke-width:1.5}
      .law{fill:#7a1f2b}
      .lawtext{fill:#fbe3e6;font-size:10.5px;font-weight:600}
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="560" fill="#f4f7fa"/>

  <!-- synthetic data -->
  <rect x="20" y="60" width="190" height="110" rx="10" class="box"/>
  <text x="40" y="90" class="txt">Synthetic bank bundle</text>
  <text x="40" y="112" class="sub">seed=42 · 7 CSVs</text>
  <text x="40" y="130" class="sub">46,978 txns · 9,124 logs</text>
  <text x="40" y="148" class="sub">S1–S7 woven + L1–L5 traps</text>
  <rect x="20" y="180" width="190" height="36" rx="8" class="law"/>
  <text x="34" y="203" class="lawtext">ever REGENERATED — never trusted</text>

  <!-- ingestion -->
  <rect x="270" y="60" width="170" height="110" rx="10" class="box"/>
  <text x="290" y="90" class="txt">IngestionService</text>
  <text x="290" y="112" class="sub">per-file sha256 verify</text>
  <text x="290" y="130" class="sub">FK-clean bulk copy</text>
  <text x="290" y="148" class="sub">idempotent (PK dedupe)</text>

  <!-- postgres -->
  <rect x="500" y="60" width="180" height="110" rx="10" class="box"/>
  <text x="520" y="90" class="txt">PostgreSQL 16</text>
  <text x="520" y="112" class="sub">11 tables · ARRAY INT</text>
  <text x="520" y="130" class="sub">evidence CHECKs at DB</text>
  <text x="520" y="148" class="sub">alerts can never be bare</text>

  <!-- ground truth boundary -->
  <rect x="500" y="200" width="180" height="52" rx="8" class="law"/>
  <text x="514" y="221" class="lawtext">ground_truth — truth lives here</text>
  <text x="514" y="240" class="lawtext">engine can NEVER read (AST test)</text>

  <!-- engine -->
  <rect x="750" y="40" width="330" height="230" rx="12" class="box"/>
  <text x="770" y="70" class="cap">DETECTION ENGINE (Phase 03–04)</text>
  <text x="770" y="104" class="txt">T-rules (money-flow)</text>
  <text x="770" y="122" class="sub">T1 cycles · T2 structuring · T3 fan-in</text>
  <text x="770" y="138" class="sub">T4 pass-through · T5 dormant · T6 income mismatch</text>
  <text x="770" y="172" class="txt">E-rules (privilege)</text>
  <text x="770" y="190" class="sub">E1 night ops · E2 role violation · E3 stale access</text>
  <text x="770" y="206" class="sub">E4 config churn · E5 alert tamper</text>
  <text x="770" y="240" class="txt">Fusion + Scoring + Merger</text>
  <text x="770" y="258" class="sub">F1 correlation · F2 alert disable · F3 cross-branch</text>

  <!-- api -->
  <rect x="270" y="300" width="390" height="130" rx="12" class="box"/>
  <text x="290" y="330" class="cap">FastAPI (async · factory pattern)</text>
  <text x="290" y="358" class="txt">Routers</text>
  <text x="290" y="378" class="sub">alerts · cases (state machine) · export ZIP</text>
  <text x="290" y="396" class="sub">graph/ego · analysis/run · evaluation · analysts</text>
  <text x="290" y="414" class="sub">security: prod CORS guard · 5/min run limiter · headers</text>

  <!-- web -->
  <rect x="750" y="320" width="330" height="110" rx="12" class="box"/>
  <text x="770" y="350" class="cap">React 18 + Vite 6 + Tailwind v4</text>
  <text x="770" y="376" class="txt">Dashboard / Explorer / Cases / Evaluation</text>
  <text x="770" y="398" class="sub">score = ledger (Σ reasons) · graph canvas</text>
  <text x="770" y="416" class="sub">optimistic updates · toast feedback</text>

  <!-- evaluation -->
  <rect x="20" y="300" width="190" height="130" rx="10" class="box"/>
  <text x="40" y="330" class="txt">EvaluationService</text>
  <text x="40" y="352" class="sub">SQL overlap: entity_ids &amp;&amp;</text>
  <text x="40" y="370" class="sub">P/R/F1/FPR by scenario</text>
  <text x="40" y="388" class="sub">unverified alerts ≠ FP</text>
  <text x="40" y="410" class="sub">cache per run_id</text>

  <!-- edges -->
  <path d="M210,115 L270,115" stroke="#0f6a8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M440,115 L500,115" stroke="#0f6a8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M680,110 L750,110" stroke="#0f6a8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="688" y="98" class="sub">frames</text>
  <path d="M915,270 L915,320" stroke="#0f6a8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="925" y="300" class="sub">Alert(model) → rows</text>
  <path d="M460,300 C460,250 560,252 580,200" stroke="#7a1f2b" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="462" y="265" class="lawtext">evaluation ← reads alerts + truth (lawful)</text>
  <path d="M741,270 C741,300 660,300 660,330" stroke="#0f6a8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="668" y="290" class="sub">submit / query</text>
  <path d="M660,365 L750,365" stroke="#0f6a8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="666" y="355" class="sub">REST /api/*</text>
  <path d="M465,270 L465,300" stroke="#0f6a8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <text x="20" y="522" class="sub">InsiderLens — layers are honest boundaries: engine ε ground truth (guard test) · zone of truth marked red · every edge idempotent by construction.</text>
</svg>
